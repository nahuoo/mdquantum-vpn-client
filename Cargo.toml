[package]
name = "vpn-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vpn-client"
path = "src/main.rs"

# Post-quantum VPN client establishing secure tunnels using quantum-resistant
# cryptographic algorithms: CRYSTALS-Kyber (KEM) and CRYSTALS-Dilithium (signatures).
# Supports SOCKS5 proxy and TUN interface for full IP-layer tunneling.

[dependencies]
# Asynchronous runtime for non-blocking I/O operations
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "time", "sync"] }

# TLS 1.3 client for secure transport layer
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1.0"

# Post-quantum key encapsulation (CRYSTALS-Kyber / ML-KEM)
# Provides quantum-resistant key exchange replacing classical ECDH
pqcrypto-kyber = { version = "0.8", features = ["kyber512", "kyber768", "kyber1024"] }
pqcrypto = "0.18"

# Post-quantum digital signatures (CRYSTALS-Dilithium / ML-DSA)
# Provides quantum-resistant authentication replacing RSA/ECDSA
pqcrypto-dilithium = { version = "0.5", features = ["dilithium2", "dilithium3", "dilithium5"] }

# Post-quantum hash-based signatures (SPHINCS+) as backup algorithm
pqcrypto-sphincsplus = "0.7"

# General-purpose cryptography (AES-GCM, SHA-3, HKDF)
ring = "0.17"
subtle = "2.6"

# Random number generation for cryptographic operations
rand = "0.8"

# SOCKS5 proxy server for application-level traffic redirection
fast-socks5 = "1.0"

# TUN/TAP interface for full IP-layer tunneling
tun = "0.8"

# Command-line argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling with error chains
anyhow = "1"
thiserror = "2"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-forest = "0.3"

# Serialization for protocol messages (compact binary format)
postcard = "1"
bytes = "1"

# Async utilities
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"

# Networking utilities
socket2 = "0.5"

[dev-dependencies]
rcgen = "0.14"
